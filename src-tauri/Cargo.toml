[package]
name = "watermark"
version = "1.0.0"
description = "水印框 · 本地图片信息水印工具"
authors = ["水印框"]
edition = "2021"
rust-version = "1.77.2"

# 桌面壳（薄）：只负责开窗口、加载 web/ 静态页面、提供系统「另存为」。
[lib]
name = "watermark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
